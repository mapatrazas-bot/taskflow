name: Pipeline de CI/CD de TaskFlow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./taskflow

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'taskflow/pom.xml'

      - name: Ejecutar Compilación y Tests (35 Tests)
        run: mvn clean test -B

      - name: Empaquetar JAR
        run: mvn package -DskipTests -B

      - name: Validar Build de Docker
        run: docker build -t taskflow-api:test .