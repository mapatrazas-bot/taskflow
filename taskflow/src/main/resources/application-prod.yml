# ─────────────────────────────────────────────────────────────
# Perfil PROD — Configuración para Producción y Docker
# Se activa con: spring.profiles.active=prod
# ─────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskflow_db}
    username: ${SPRING_DATASOURCE_USERNAME:taskflow_user}
    password: ${SPRING_DATASOURCE_PASSWORD:taskflow_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Ajuste de seguridad y JWT para producción
taskflow:
  security:
    jwt-secret: ${JWT_SECRET:taskflow-secret-key-must-be-at-least-256-bits-long-for-hs256!!}
    jwt-expiration: ${JWT_EXPIRATION:86400000}

# Endpoints de Actuator limitados en producción
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging minimalista en producción
logging:
  level:
    com.taskflow: INFO
    org.springframework: WARN